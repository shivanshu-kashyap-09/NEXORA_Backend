services:
  # PostgreSQL 16 Primary Relational Database (Multi-Tenant RLS Enabled)
  postgres:
    image: postgres:16-alpine
    container_name: nexora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 In-Memory Cache, Distributed Mutex & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: nexora_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander UI (Optional Web GUI for Redis inspection)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nexora_redis_ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
